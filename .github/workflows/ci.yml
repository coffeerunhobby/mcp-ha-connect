name: CI

# Advisory only. This workflow REPORTS a pass/fail status on commits and PRs.
# It does NOT block commits, pushes, or merges. The code builds, publishes, and
# deploys with zero dependency on this file — delete it and nothing breaks.
# (Blocking only happens if you separately enable branch-protection in the
#  GitHub web UI, which is off by default and intentionally not set here.)

on:
  push:
    branches: [main, dev]
    # Version tags trigger the full gate + auto-create the GitHub Release (see
    # the `release` job) — v1.5.4 sat tag-only for two weeks because the manual
    # `gh release create` step kept getting skipped.
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  # Lets you re-run it by hand from the Actions tab.
  workflow_dispatch:

# If you push twice quickly, cancel the older run instead of stacking them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    strategy:
      # Don't kill the Node 22 run just because Node 20 failed (or vice-versa) —
      # we want to see both results.
      fail-fast: false
      matrix:
        # The LTS lines we support (package.json engines: ">=20") plus 26 —
        # the Docker image's actual runtime since v1.5.5 (LTS from 2026-10).
        node-version: ['20.x', '22.x', '26.x']

    name: node ${{ matrix.node-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # npm ci installs exactly what's in package-lock.json (reproducible),
      # the same command Docker uses. It never edits the lockfile.
      - name: Install dependencies
        run: npm ci

      # 1. Compile cleanly (tsc -> dist/). Catches type errors.
      - name: Build
        run: npm run build

      # 2. Lint src + tests. CLAUDE.md policy: zero errors AND zero warnings.
      #    --max-warnings=0 makes a warning fail the job, matching that policy.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      # 3. Version-sync gate. Fails if package.json / src/version.ts / openapi.json
      #    disagree on the version — the exact drift CLAUDE.md warns about.
      - name: Version sync
        run: npm run check:sync

      # 4. Unit tests WITH coverage gate. test:coverage excludes tests/integration/**
      #    (those need a live .env CI must never have) and enforces the regression
      #    floor in vitest.config.ts — a coverage DROP fails the build.
      - name: Test + coverage gate
        run: npm run test:coverage

  release:
    # Auto-create the GitHub Release when a `v*` tag passes the gate above.
    # Notes are auto-generated from the commits since the previous release;
    # polish them in the web UI afterwards if the release deserves prose.
    # Idempotent: if the Release already exists (created by hand), this no-ops.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --latest --generate-notes --title "$GITHUB_REF_NAME"

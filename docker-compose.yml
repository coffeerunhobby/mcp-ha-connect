services:
  mcp-ha-connect:
    build: .
    container_name: mcp-ha-connect
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      # Bind all interfaces inside the container so Docker's port map works.
      - MCP_HTTP_BIND_ADDR=0.0.0.0
      # M1: do NOT hard-code a wildcard origin here. Set MCP_HTTP_ALLOWED_ORIGINS
      # in .env to the exact public origin(s) — e.g. your Cloudflare domain in
      # both bare-host and https:// form — so DNS-rebinding/CORS protection works.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

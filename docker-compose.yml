services:
  mcp-ha-connect:
    build: .
    container_name: mcp-ha-connect
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - MCP_HTTP_BIND_ADDR=0.0.0.0
      - MCP_HTTP_ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
